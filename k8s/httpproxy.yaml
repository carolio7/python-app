apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: python-app
spec:
  virtualhost:
    fqdn: python-app.test.com
  routes:
    - conditions:
      - prefix: /
      services:
        - name: python-app
          port: 8080
    - conditions:
      - prefix: /subpage
      services:
        - name: service-that-does-not-exist
          port: 8080